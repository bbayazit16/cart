name: Build and Release Cart

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-22.04, macos-13, macos-14 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM
        id: llvm-install
        run: |
          if [[ "${{ matrix.os }}" == *"ubuntu"* ]]; then
            sudo apt-get update
            wget https://apt.llvm.org/llvm.sh && \
              chmod u+x llvm.sh && \
              sudo ./llvm.sh 18 && \
              sudo apt install -y libpolly-18-dev libz-dev gcc-aarch64-linux-gnu
            echo "LLVM_SYS_PREFIX=/usr/lib/llvm-18" >> $GITHUB_OUTPUT
          else
            brew install llvm@18 zstd
            echo "LLVM_SYS_PREFIX=$(brew --prefix llvm@18)" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build Cart
        env:
          LLVM_SYS_PREFIX: ${{ steps.llvm-install.outputs.LLVM_SYS_PREFIX }}
        run: |
          export LLVM_SYS_180_PREFIX=${LLVM_SYS_PREFIX}
          if [[ "${{ matrix.os }}" == *"macos"* ]]; then
            export LIBRARY_PATH="$LIBRARY_PATH:$(brew --prefix zstd)/lib"
          fi
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            cargo build --release
            cargo build --release --target aarch64-unknown-linux-gnu
          else
            cargo build --release
          fi

      - name: Package Files
        run: |
          mkdir -p dist/bin dist/lib
          cp target/release/cart dist/bin/
          cp target/release/libcartstd.a dist/lib/
          tar -czf cartlang-${{ matrix.os }}.tar.gz -C dist .

          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            mkdir -p dist-arm/bin dist-arm/lib
            cp target/aarch64-unknown-linux-gnu/release/cart dist-arm/bin/
            cp target/aarch64-unknown-linux-gnu/release/libcartstd.a dist-arm/lib/
            tar -czf cartlang-${{ matrix.os }}-arm64.tar.gz -C dist-arm .
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cart-build-${{ matrix.os }}
          path: |
            cartlang-${{ matrix.os }}.tar.gz
            ${{ matrix.os == 'ubuntu-22.04' && 'cartlang-ubuntu-22.04-arm64.tar.gz' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact for ubuntu-22.04 x86_64
        uses: actions/download-artifact@v4
        with:
          name: cart-build-ubuntu-22.04

      - name: Download Artifact for ubuntu-22.04 arm64
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        uses: actions/download-artifact@v4
        with:
          name: cart-build-ubuntu-22.04-arm64

      - name: Download Artifact for macos-13 x86_64
        uses: actions/download-artifact@v4
        with:
          name: cart-build-macos-13

      - name: Download Artifact for macos-14 arm64
        uses: actions/download-artifact@v4
        with:
          name: cart-build-macos-14

      - name: Rename Files
        run: |
          mv cart-build-ubuntu-22.04 cartlang-ubuntu-22.04-x86_64.tar.gz
          mv cart-build-ubuntu-22.04-arm64 cartlang-ubuntu-22.04-arm64.tar.gz
          mv cart-build-macos-13 cartlang-macos-13-x86_64.tar.gz
          mv cart-build-macos-14 cartlang-macos-14-arm64.tar.gz

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            cartlang-ubuntu-22.04-x86_64.tar.gz
            cartlang-ubuntu-22.04-arm64.tar.gz
            cartlang-macos-13-x86_64.tar.gz
            cartlang-macos-14-arm64.tar.gz
          body: "Release of Cart Compiler version ${{ github.ref_name }}."
          tag: ${{ github.ref_name }}
